name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Fresh runner each time: incremental artifacts only cost time and cache space.
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check RPM smoke gate regressions
        run: python3 scripts/tests/test_smoke_linux_rpm.py -v
      - name: Check development installer fixtures
        run: python3 scripts/tests/test_install_dev.py -v
      - name: Check build benchmark and cache qualification fixtures
        run: |
          python3 scripts/tests/test_benchmark_cold_builds.py -v
          python3 scripts/tests/test_qualify_bazel_cache.py -v
          python3 scripts/tests/test_prepare_ci_rust.py -v
          python3 scripts/tests/test_bootstrap_kache.py -v
          python3 scripts/tests/test_run_kache.py -v
      - name: Install pinned Rust toolchain
        run: python3 scripts/prepare-ci-rust.py
      # Temporary diagnostic only: generate verified diff for a security patch.
      # Remove this step once Cargo.lock has been updated and committed.
      - name: Generate security patch lockfile diff
        run: |
          cargo update -p wasmtime --precise 48.0.7
          printf '\nWASMTIME_LOCK_DIFF_BEGIN\n'
          git diff -- Cargo.lock
          printf '\nWASMTIME_LOCK_DIFF_END\n'
      - name: Test Linux profiler DRM parsing
        run: python3 scripts/tests/test_profile_linux.py -v
      # The setup exports a stable job-owned RUSTUP_HOME. rust-cache hashes every
      # installed compiler, so unrelated runner-image toolchains must stay outside it.
      - name: Cache Cargo registry and dependency artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run core checks
        run: bash scripts/check.sh core
      # cargo-deny-action builds a Docker image and rustup-installs the pinned
      # toolchain a second time inside Alpine. Use the same audited cargo-deny
      # release as that image, directly in our already prepared Rust environment.
      # A pinned installer with checksum validation avoids source compilation.
      - name: Install cargo-deny
        uses: step-security/taiki-e-install-action@902be7994b3b54e9eac6fb41c67c1bb0ef9e444b # v2.87.18
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Audit dependencies
        run: cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  # Compiles GPUI and the `desktop` feature, and runs the `diffz-ui` tests, which
  # `check` skips. The `cargo build` lines of `scripts/check.sh native` are left
  # to the package workflows.
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Fresh runner each time: incremental artifacts only cost time and cache space.
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same libraries as the Debian and Ubuntu build in docs/linux.md.
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxcb1-dev \
            libssl-dev libzstd-dev libvulkan-dev
      - name: Install pinned Rust toolchain
        run: python3 scripts/prepare-ci-rust.py
      # Keep compiler/config hashing while excluding unrelated image toolchains.
      - name: Cache Cargo registry and dependency artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test every crate with all features
        run: cargo test --locked --workspace --all-features
      - name: Lint every crate with all features
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      # Cargo's integration-test build produces the ordinary app binary. Reuse its
      # all-features/test-support graph; package jobs qualify default-feature builds.
      # Installs only under RUNNER_TEMP.
      - name: Smoke-test install-dev and uninstall-dev
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          root="$RUNNER_TEMP/install-dev"
          export XDG_STATE_HOME="$root/xdg-state"
          dirs=(PREFIX="$root/prefix" DATADIR="$root/share" DEV_STATE_DIR="$root/state")
          bin="$GITHUB_WORKSPACE/target/debug/diffz"
          if [ ! -x "$bin" ]; then
            printf 'App binary from cargo test is missing or not executable: %s\n' "$bin" >&2
            exit 1
          fi
          make install-dev BIN="$bin" "${dirs[@]}"
          find "$root" -type f | sort
          "$root/prefix/bin/diffz-dev" --version
          "$root/prefix/bin/diffz-dev" --inspect --fixture F01 > /dev/null
          test -f "$root/state/review.sqlite3"
          test ! -e "$XDG_STATE_HOME/diffz"
          "$root/prefix/bin/diffz-dev" --state-dir "$root/override" --inspect --fixture F01 > /dev/null
          test -f "$root/override/review.sqlite3"
          "$root/prefix/bin/diffz-dev" --doctor > /dev/null
          desktop-file-validate "$root/share/applications/io.github.zzwong.Diffz.Dev.desktop"
          make uninstall-dev "${dirs[@]}"
          leftover="$(find "$root/prefix" "$root/share" -type f)"
          if [ -n "$leftover" ]; then
            printf 'uninstall-dev left files behind:\n%s\n' "$leftover" >&2
            exit 1
          fi
          test -d "$root/state"

  # The patched macOS backend must compile when upgrading the shared GPUI stack.
  # Release packaging is tag/manual-only, so it cannot guard dependency PRs.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pinned tool bootstrap and runtime fixtures
        run: |
          python3 scripts/tests/test_bootstrap_kache.py -v
          python3 scripts/tests/test_run_kache.py -v
      - name: Install pinned Rust toolchain
        run: python3 scripts/prepare-ci-rust.py
      - name: Cache Cargo registry and dependency artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check every macOS target with all features
        run: cargo check --locked --workspace --all-features --all-targets
