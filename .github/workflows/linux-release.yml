name: Release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ make pkg-config \
            openssl-devel fontconfig-devel \
            libX11-devel libXcursor-devel libXi-devel libxcb-devel \
            libxkbcommon-devel libxkbcommon-x11-devel wayland-devel \
            vulkan-loader-devel libzstd-devel \
            desktop-file-utils appstream rpm-build tar gzip curl

      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup show

      - name: Build release binary
        run: |
          . "$HOME/.cargo/env"
          cargo build --locked --release -p diffz

      - name: Stage and validate Linux metadata
        run: |
          . "$HOME/.cargo/env"
          bash scripts/stage-linux.sh
          desktop-file-validate \
            dist/linux-root/usr/share/applications/io.github.zzwong.Diffz.desktop
          appstreamcli validate --no-net \
            dist/linux-root/usr/share/metainfo/io.github.zzwong.Diffz.metainfo.xml

      - name: Build RPM and portable archive
        run: |
          bash scripts/package-linux-rpm.sh
          bash scripts/package-linux-tarball.sh

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum -- *.rpm *.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diffz-linux-release
          path: |
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Git for checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the initial fetch needs credentials; later Git runs as builder.
          persist-credentials: false
          # The package recipe pins a source commit, which may precede this ref.
          fetch-depth: 0

      - name: Install dependencies declared by the Arch recipe
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source packaging/arch/PKGBUILD
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$pkgver" ]]; then
            echo 'Update the Arch package version for this release.' >&2
            exit 1
          fi
          if ! git diff --quiet "$_commit" HEAD -- Cargo.toml Cargo.lock rust-toolchain.toml crates fixtures packaging/linux LICENSE THIRD_PARTY_NOTICES.md; then
            echo 'Update the Arch source commit and checksum to include the application changes.' >&2
            exit 1
          fi
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}"
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build and test Arch package as an unprivileged user
        shell: bash
        run: |
          runuser -u builder -- bash scripts/package-arch.sh --noconfirm
          cd target/arch-package
          sha256sum -- diffz-[0-9]*.pkg.tar.zst > SHA256SUMS

      - name: Verify Arch package installation
        run: |
          pacman -U --noconfirm target/arch-package/diffz-[0-9]*.pkg.tar.zst
          diffz --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diffz-arch-release
          path: |
            target/arch-package/diffz-[0-9]*.pkg.tar.zst
            target/arch-package/SHA256SUMS
          if-no-files-found: error

  debian:
    uses: ./.github/workflows/debian-packages.yml

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build macOS DMG
        run: make package-macos

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diffz-macos-release
          path: |
            target/dist/**/*.dmg
            target/dist/**/SHA256SUMS
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [linux, arch, debian, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: diffz-*
          path: artifacts
          merge-multiple: false

      - name: Collect release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release

          declare -A seen=()
          asset_count=0
          while IFS= read -r -d '' source; do
            basename="${source##*/}"
            published_basename="${basename//\~/.}"
            if [[ -n "${seen[$published_basename]+x}" ]]; then
              echo "Duplicate release asset basename: $published_basename" >&2
              exit 1
            fi
            seen["$published_basename"]=1
            cp -- "$source" "release/$published_basename"
            asset_count=$((asset_count + 1))
          done < <(
            find artifacts -type f \( \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.tar.gz' -o \
              -name '*.pkg.tar.zst' -o \
              -name '*.dmg' \
            \) -print0
          )

          if (( asset_count == 0 )); then
            echo 'No release assets found.' >&2
            exit 1
          fi

          (
            cd release
            mapfile -d '' asset_names < <(
              find . -maxdepth 1 -type f \( \
                -name '*.deb' -o \
                -name '*.rpm' -o \
                -name '*.tar.gz' -o \
                -name '*.pkg.tar.zst' -o \
                -name '*.dmg' \
              \) -printf '%f\0' | LC_ALL=C sort -z
            )
            sha256sum -- "${asset_names[@]}" | LC_ALL=C sort -k2,2 > SHA256SUMS
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "diffz $GITHUB_REF_NAME"
