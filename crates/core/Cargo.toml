[package]
name = "diffz-core"
description = "Patch parsing, snapshot state, and the review model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
features = ["syntax"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
toml = { workspace = true }

[features]
default = []
syntax = [
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-java",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-heex",
]
# Separate from `syntax` because the grammar needs a newer commit than its only
# crates.io release; the workspace patches it in, so this feature does not build
# against the published 1.0.0.
gleam = ["syntax", "dep:tree-sitter-gleam"]
# Builds wasmtime, which needs cmake.
wasm = ["syntax", "tree-sitter/wasm", "dep:wasmtime"]

[dependencies.wasmtime]
version = "48"
optional = true
default-features = false
features = ["component-model", "cranelift", "runtime", "std"]

[dependencies.tree-sitter]
version = "0.27"
optional = true
[dependencies.tree-sitter-highlight]
version = "0.27"
optional = true
[dependencies.tree-sitter-rust]
version = "0.24"
optional = true
[dependencies.tree-sitter-typescript]
version = "0.23"
optional = true
[dependencies.tree-sitter-javascript]
version = "0.25"
optional = true
[dependencies.tree-sitter-json]
version = "0.24"
optional = true
[dependencies.tree-sitter-python]
version = "0.25"
optional = true
[dependencies.tree-sitter-go]
version = "0.25"
optional = true
[dependencies.tree-sitter-c]
version = "0.24"
optional = true
[dependencies.tree-sitter-cpp]
version = "0.23"
optional = true
[dependencies.tree-sitter-java]
version = "0.23"
optional = true
[dependencies.tree-sitter-ruby]
version = "0.23"
optional = true
[dependencies.tree-sitter-bash]
version = "0.25"
optional = true
[dependencies.tree-sitter-toml-ng]
version = "0.7"
optional = true
[dependencies.tree-sitter-yaml]
version = "0.7"
optional = true
[dependencies.tree-sitter-html]
version = "0.23"
optional = true
[dependencies.tree-sitter-css]
version = "0.25"
optional = true
[dependencies.tree-sitter-elixir]
version = "0.3"
optional = true
[dependencies.tree-sitter-heex]
version = "0.8"
optional = true
[dependencies.tree-sitter-gleam]
version = "1.0.0"
optional = true
