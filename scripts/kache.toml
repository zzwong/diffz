# This file is selected explicitly by the root Makefile and defines the cache
# policy used by its Kache-backed targets.
[cache]
ignore_env = true
local_only = true
local_max_size = "8GiB"
# Make resolves this once against the checkout root before Cargo changes cwd
# for individual crates. The default local_store stays shareable across worktrees.
runtime_dir = "target/kache/runtime"
