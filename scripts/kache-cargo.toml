# Explicit Cargo layer selected by scripts/kache-build.sh. The force flags keep
# ambient Cargo [env] entries from replacing the local-only Kache policy.
[build]
rustc-wrapper = "target/kache/0.21.0/bin/kache"
rustc-workspace-wrapper = ""

[env]
KACHE_CONFIG = { value = "scripts/kache.toml", relative = true, force = true }
KACHE_HOST_CONFIG = { value = "", force = true }
KACHE_RUNTIME_DIR = { value = "target/kache/runtime", relative = true, force = true }
KACHE_SOCKET_PATH = { value = "target/kache/runtime/daemon.sock", relative = true, force = true }
KACHE_LOCAL_ONLY = { value = "1", force = true }
KACHE_MAX_SIZE = { value = "8GiB", force = true }
KACHE_FALLBACK = { value = "", force = true }
RUSTC_WRAPPER = { value = "", force = true }
RUSTC_WORKSPACE_WRAPPER = { value = "", force = true }
