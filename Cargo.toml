[workspace]
resolver = "2"
members = ["crates/core", "crates/adapters", "crates/ui", "crates/app"]
default-members = ["crates/core", "crates/adapters"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false
description = "Review diffs and pull requests on the desktop"
repository = "https://github.com/zzwong/diffz"
homepage = "https://github.com/zzwong/diffz"
readme = "README.md"
keywords = ["diff", "code-review", "github", "gitlab", "gpui"]
categories = ["development-tools", "gui"]
rust-version = "1.98"
authors = ["Aaron Wong"]

[workspace.dependencies]
diffz-core = { path = "crates/core", version = "0.4.0" }
diffz-adapters = { path = "crates/adapters", version = "0.4.0" }
diffz-ui = { path = "crates/ui", version = "0.4.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
sha1 = "0.11"
thiserror = "2"
anyhow = "1"
unicode-segmentation = "=1.13.3"
url = "2.5"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
fs2 = "=0.4.3"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
tempfile = "3"
gpui-kit = "=0.7.3"

smol = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
unicode-linebreak = "0.1.5"

# Temporary: carries the Vulkan-first GPU init and on-demand path textures that are
# going upstream to zed-industries/zed. Remove this and the deny.toml allow-git entry
# once a gpui-pre snapshot ships them.
[patch.crates-io]
gpui-pre-wgpu = { git = "https://github.com/zzwong/gpui-pre-wgpu", rev = "389e7f33bed4f6237ccb53f2b4884d996274a453" }
# Temporary GPUI 0.3.9 port of visual magnification and viewport/accessibility polish.
# The fork integrates on diffz/main; pin an exact revision for reproducible builds.
gpui-pre = { git = "https://github.com/zzwong/gpui-pre", rev = "d79c3d1191aa68d4753e1ca410c2d10c261b4572" }
# Temporary: stops the input cursor blink after 5 s idle and in an inactive window (#69),
# pending longbridge/gpui-kit. Remove it with its deny.toml allow-git entry.
gpui-base = { git = "https://github.com/zzwong/gpui-base", rev = "6235089ccddd423369749017dabb4f6df8a3c169" }
# Temporary X11 frame-demand fix (#88) and direct Wayland activation handoff.
# Published gpui-pre-linux 0.3.9 plus the two recorded patches in patches/.
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# Temporary: stops the idle macOS display link (#76); remove with its deny.toml entry
# when gpui-pre-macos includes the demand-driven frame source.
gpui-pre-macos = { git = "https://github.com/zzwong/gpui-pre-macos", rev = "28057de61df9442cb521497a63193e70dc36019f" }
# The highlight and injection queries diffz uses are newer than the 1.0.0 release.
# diffz-core's `gleam` feature depends on this patch.
tree-sitter-gleam = { git = "https://github.com/gleam-lang/tree-sitter-gleam", rev = "c610c282ef73f830d80c1f0999dce8e83f024ef5" }

[profile.dev]
debug = 1

# Around 400 dependency crates' debug info made the dev binary 454 MB and every
# link 1.85 s; without it the binary is 257 MB and the link 1.25 s. Workspace
# crates keep `debug = 1`, and so does the GPUI stack, where the crashes that
# need a gdb session are. CONTRIBUTING.md has the trade-off and how to get the
# rest back for one build.
[profile.dev.package]
"*" = { opt-level = 2, debug = 0 }
gpui-pre = { debug = 1 }
gpui-pre-linux = { debug = 1 }
gpui-pre-platform = { debug = 1 }
gpui-pre-wgpu = { debug = 1 }
gpui-base = { debug = 1 }
gpui-component = { debug = 1 }
gpui-kit = { debug = 1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
