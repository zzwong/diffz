[workspace]
resolver = "2"
members = ["crates/core", "crates/adapters", "crates/ui", "crates/app"]
default-members = ["crates/core", "crates/adapters"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
publish = false
description = "Review diffs and pull requests on the desktop"
repository = "https://github.com/zzwong/diffz"
homepage = "https://github.com/zzwong/diffz"
readme = "README.md"
keywords = ["diff", "code-review", "github", "gitlab", "gpui"]
categories = ["development-tools", "gui"]
rust-version = "1.98"
authors = ["Aaron Wong"]

[workspace.dependencies]
diffz-core = { path = "crates/core" }
diffz-adapters = { path = "crates/adapters" }
diffz-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
anyhow = "1"
unicode-segmentation = "=1.13.3"
url = "2.5"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
fs2 = "=0.4.3"
libc = "0.2"
tempfile = "3"
gpui-kit = "=0.6.0"

smol = "2"
unicode-linebreak = "0.1.5"

# Temporary: carries the Vulkan-first GPU init and on-demand path textures that are
# going upstream to zed-industries/zed. Remove this and the deny.toml allow-git entry
# once a gpui-pre snapshot ships them.
[patch.crates-io]
gpui-pre-wgpu = { git = "https://github.com/zzwong/gpui-pre-wgpu", rev = "c74eb0aa61c314c94769f98c887cb3659cd24b3f" }

[profile.dev]
debug = 1

# Around 400 dependency crates' debug info made the dev binary 454 MB and every
# link 1.85 s; without it the binary is 257 MB and the link 1.25 s. Workspace
# crates keep `debug = 1`, and so does the GPUI stack, where the crashes that
# need a gdb session are. CONTRIBUTING.md has the trade-off and how to get the
# rest back for one build.
[profile.dev.package]
"*" = { opt-level = 2, debug = 0 }
gpui-pre = { debug = 1 }
gpui-pre-linux = { debug = 1 }
gpui-pre-platform = { debug = 1 }
gpui-pre-wgpu = { debug = 1 }
gpui-base = { debug = 1 }
gpui-component = { debug = 1 }
gpui-kit = { debug = 1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
